<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Mental Health Crossword</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f5;color:#18231d;font-family:Arial,sans-serif}
header{text-align:center;background:#fff;border-bottom:1px solid #ddd;padding:24px 12px}
h1{margin:0;font-size:28px}
#date{color:#68736d;margin-top:6px;font-size:14px}
main{max-width:900px;margin:28px auto;padding:0 15px}
.game{display:grid;grid-template-columns:400px 1fr;gap:35px}
#grid{width:400px;max-width:94vw;aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);border:3px solid #222;background:#222;gap:1px;margin:auto}
.cell{position:relative;background:#fff;cursor:pointer;user-select:none}
.block{background:#202522!important;cursor:default}
.number{position:absolute;top:3px;left:4px;font-size:10px;font-weight:bold}
.letter{position:absolute;inset:12px 0 0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600}
.hl{background:#dcefe7}.selected{background:#b9ddce!important}
.correct{background:#ddf2df}.wrong{background:#ffdede}
.active{margin-top:12px;background:#fff;border:1px solid #ddd;border-radius:7px;padding:11px;font-weight:600}
.active b{color:#39745c;margin-right:8px}
.controls{text-align:center;margin-top:12px}
button{padding:9px 14px;margin:3px;border:1px solid #aaa;border-radius:7px;background:#fff;font-weight:600;cursor:pointer}
#status{min-height:23px;margin-top:8px;font-weight:bold}
#timer{font-size:13px;color:#68736d}
h2{font-size:19px;border-bottom:2px solid #222;padding-bottom:6px;margin:0 0 8px}
.clue{padding:8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;line-height:1.35}
.clue:hover,.chosen{background:#dcefe7}
.cn{width:26px;font-weight:bold}
.help{margin-top:28px;padding:15px;background:#fff;border:1px solid #ddd;border-radius:7px;color:#68736d;font-size:14px;line-height:1.5}
@media(max-width:700px){.game{grid-template-columns:1fr}.clues{display:grid;grid-template-columns:1fr 1fr;gap:25px}}
@media(max-width:450px){.clues{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>

<body>

<header>
<h1>Daily Mental Health Crossword</h1>
<div id="date"></div>
</header>

<main>
<div class="game">

<section>
<div id="grid"></div>

<div class="active">
<b id="activeNumber"></b>
<span id="activeClue"></span>
</div>

<div class="controls">
<button onclick="checkPuzzle()">Check</button>
<button onclick="clearPuzzle()">Clear</button>
<button onclick="revealPuzzle()">Reveal</button>
<div id="status"></div>
<div id="timer"></div>
</div>
</section>

<section class="clues">
<div>
<h2>Across</h2>
<div id="across"></div>
</div>

<div>
<h2>Down</h2>
<div id="down"></div>
</div>
</section>

</div>

<div class="help">
<strong>How to play:</strong>
Click a square and type a letter.
Click the selected square again to switch between Across and Down.
Use the arrow keys to move.
Your progress is saved automatically.
A new crossword is generated each day.
</div>
</main>

<script>

/* =========================================================
   MENTAL HEALTH WORD BANK
   ========================================================= */

const WORDS={

ACT:"Acceptance and Commitment Therapy",
CBT:"Cognitive Behavioral Therapy",
DBT:"Dialectical Behavior Therapy",
EFT:"Emotion-Focused Therapy",
ERP:"Exposure and Response Prevention",
IFS:"Internal Family Systems",
IPT:"Interpersonal Therapy",
PST:"Problem-Solving Therapy",
ECT:"Electroconvulsive Therapy",
TMS:"Transcranial Magnetic Stimulation",

ASD:"Autism Spectrum Disorder",
BPD:"Borderline Personality Disorder",
DID:"Dissociative Identity Disorder",
GAD:"Generalized Anxiety Disorder",
MDD:"Major Depressive Disorder",
OCD:"Obsessive-Compulsive Disorder",
SAD:"Seasonal Affective Disorder",
SUD:"Substance Use Disorder",

EGO:"The part of personality involved with reality",
MOOD:"A person's emotional state",
FEAR:"An emotional response to perceived threat",
SHAME:"A painful feeling of negative self-evaluation",
GRIEF:"The emotional response to loss",
PANIC:"A sudden surge of intense fear or distress",
WORRY:"Repeated thoughts about possible problems",
DREAD:"Strong anticipation of something feared",

CALM:"A state of reduced agitation",
COPE:"To manage a difficult situation",
EASE:"Freedom from tension or distress",
REST:"Recovery through relaxation or sleep",
HOPE:"A sense that positive change is possible",
HELP:"Support when someone is struggling",
CARE:"Support or attention for wellbeing",
SAFE:"Free from danger or threat",
HEAL:"To recover or become healthier",
TALK:"A common part of seeking emotional support",
FOCUS:"Directed attention",
TRUST:"Confidence in another person or process",
PEACE:"A state of calm or tranquility",
QUIET:"A low-stimulation environment",
BRAVE:"Showing courage despite fear",
RELAX:"To become less tense",
SLEEP:"An important part of mental wellbeing",
VALUE:"Something considered important",
NEEDS:"Things required for wellbeing",
VALID:"Recognized as understandable or legitimate",
ANGER:"A strong emotional response",
AWARE:"Conscious of thoughts or feelings",
THINK:"To use the mind to process information",
RESET:"A fresh start after stress or overload"

};

const wordList=Object.keys(WORDS)
.filter(w=>w.length>=3&&w.length<=5);

const SIZE=5;


/* =========================================================
   DAILY DATE
   ========================================================= */

const today=new Date();

const dateKey=
today.getFullYear()+"-"+
String(today.getMonth()+1).padStart(2,"0")+"-"+
String(today.getDate()).padStart(2,"0");

document.getElementById("date").textContent=
today.toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});


/* =========================================================
   SEEDED RANDOM NUMBER GENERATOR
   ========================================================= */

let seed=hash(dateKey);

function hash(str){
let h=2166136261;
for(let i=0;i<str.length;i++){
h^=str.charCodeAt(i);
h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);
}
return h>>>0;
}

function random(){
seed=(seed*1664525+1013904223)>>>0;
return seed/4294967296;
}

function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}


/* =========================================================
   CROSSWORD GENERATION
   ========================================================= */

function makeGrid(rows){

const grid=
Array.from(
{length:SIZE},
()=>Array(SIZE).fill("#")
);

rows.forEach((r,row)=>{

for(let i=0;i<r.word.length;i++){
grid[row][r.start+i]=r.word[i];
}

});

return grid;
}


function getDown(grid){

const result=[];

for(let col=0;col<SIZE;col++){

let row=0;

while(row<SIZE){

if(grid[row][col]==="#"){
row++;
continue;
}

const start=row;
let word="";

while(
row<SIZE &&
grid[row][col]!="#"
){
word+=grid[row][col];
row++;
}

result.push({
word,
row:start,
col
});

}

}

return result;
}


function validPrefix(grid){

for(let col=0;col<SIZE;col++){

let row=0;

while(row<SIZE){

if(grid[row][col]==="#"){
row++;
continue;
}

let word="";

while(
row<SIZE &&
grid[row][col]!="#"
){
word+=grid[row][col];
row++;
}

if(word.length<3){
return false;
}

if(
!wordList.some(w=>w.startsWith(word))
){
return false;
}

}

}

return true;
}


function validFinal(grid){

const down=getDown(grid);

if(down.length!==5)
return false;

for(const d of down){

if(
d.word.length<3 ||
d.word.length>5 ||
!WORDS[d.word]
)
return false;

}

return true;
}


function generate(){

let rows=[];
let attempts=0;

function search(row){

attempts++;

if(attempts>300000)
return null;

if(row===5){

const grid=makeGrid(rows);

if(validFinal(grid)){
return {
grid,
rows:[...rows]
};
}

return null;
}

for(const word of shuffle(wordList)){

if(rows.some(r=>r.word===word))
continue;

const starts=[];

for(
let start=0;
start+word.length<=5;
start++
){
starts.push(start);
}

for(const start of shuffle(starts)){

rows.push({word,start});

const grid=makeGrid(rows);

if(validPrefix(grid)){

const result=search(row+1);

if(result)
return result;

}

rows.pop();

}

}

return null;
}

return search(0);
}


let puzzle=generate();

if(!puzzle){

for(let i=0;i<30&&!puzzle;i++){

seed=hash(dateKey+"-"+i);
puzzle=generate();

}

}

if(!puzzle){

document.body.innerHTML=
"<h2 style='text-align:center;margin:80px'>Unable to generate today's puzzle. Please refresh.</h2>";

throw new Error("Puzzle generation failed");

}


/* =========================================================
   ENTRY NUMBERING
   ========================================================= */

const solution=puzzle.grid;

const entries={
across:[],
down:[]
};


function buildEntries(){

let number=1;

for(let row=0;row<5;row++){

for(let col=0;col<5;col++){

if(solution[row][col]==="#")
continue;

const acrossStart=
(
col===0 ||
solution[row][col-1]==="#"
)&&
col+1<5 &&
solution[row][col+1]!="#";

const downStart=
(
row===0 ||
solution[row-1][col]==="#"
)&&
row+1<5 &&
solution[row+1][col]!="#";

let used=false;


if(acrossStart){

let word="";
const coords=[];

for(
let x=col;
x<5&&solution[row][x]!="#";
x++
){

word+=solution[row][x];
coords.push([row,x]);

}

entries.across.push({
number,
word,
coords
});

used=true;

}


if(downStart){

let word="";
const coords=[];

for(
let y=row;
y<5&&solution[y][col]!="#";
y++
){

word+=solution[y][col];
coords.push([y,col]);

}

entries.down.push({
number,
word,
coords
});

used=true;

}

if(used)
number++;

}

}

}

buildEntries();


if(
entries.across.length!==5 ||
entries.down.length!==5
){

throw new Error(
"Invalid crossword numbering"
);

}


/* =========================================================
   GRID
   ========================================================= */

const cells=[];

function getNumber(row,col){

for(const e of entries.across){
if(
e.coords[0][0]===row &&
e.coords[0][1]===col
)
return e.number;
}

for(const e of entries.down){
if(
e.coords[0][0]===row &&
e.coords[0][1]===col
)
return e.number;
}

return null;
}


function drawGrid(){

const board=
document.getElementById("grid");

board.innerHTML="";

for(let row=0;row<5;row++){

cells[row]=[];

for(let col=0;col<5;col++){

const el=
document.createElement("div");

el.className="cell";


if(solution[row][col]==="#"){

el.classList.add("block");

cells[row][col]={
element:el,
letter:""
};

board.appendChild(el);
continue;

}


const number=getNumber(row,col);

if(number){

const n=
document.createElement("span");

n.className="number";
n.textContent=number;

el.appendChild(n);

}


const letter=
document.createElement("span");

letter.className="letter";

el.appendChild(letter);


cells[row][col]={
element:el,
letterElement:letter,
letter:""
};


el.onclick=()=>{

if(
selectedRow===row &&
selectedCol===col
){

direction=
direction==="across"
?"down"
:"across";

}else{

selectedRow=row;
selectedCol=col;

}

updateSelection();

};


board.appendChild(el);

}

}

}


/* =========================================================
   CLUES
   ========================================================= */

function drawClues(){

for(const type of ["across","down"]){

const box=
document.getElementById(type);

box.innerHTML="";

entries[type].forEach(
(entry,index)=>{

const clue=
document.createElement("div");

clue.className="clue";

clue.innerHTML=
`<span class="cn">${entry.number}.</span>
<span>${WORDS[entry.word]}</span>`;

clue.onclick=()=>{

direction=type;

selectedRow=
entry.coords[0][0];

selectedCol=
entry.coords[0][1];

updateSelection();

};

box.appendChild(clue);

}
);

}

}


/* =========================================================
   SELECTION
   ========================================================= */

let selectedRow=0;
let selectedCol=0;
let direction="across";


function currentEntry(){

return entries[direction].find(
e=>e.coords.some(
([r,c])=>
r===selectedRow &&
c===selectedCol
)
);

}


function updateSelection(){

document
.querySelectorAll(".cell")
.forEach(
x=>x.classList.remove(
"hl",
"selected"
)
);

const entry=currentEntry();

if(!entry)
return;

entry.coords.forEach(
([r,c])=>
cells[r][c]
.element
.classList.add("hl")
);

cells[selectedRow][selectedCol]
.element
.classList.add("selected");


document.getElementById(
"activeNumber"
).textContent=
entry.number+
(direction==="across"?"A":"D");


document.getElementById(
"activeClue"
).textContent=
WORDS[entry.word];


document
.querySelectorAll(".clue")
.forEach(
x=>x.classList.remove("chosen")
);

const list=
document.getElementById(direction)
.children;

const index=
entries[direction].indexOf(entry);

if(list[index])
list[index].classList.add("chosen");

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
"keydown",
e=>{

if(/^[a-zA-Z]$/.test(e.key)){

enterLetter(
e.key.toUpperCase()
);

moveForward();

e.preventDefault();

return;
}


if(e.key==="Backspace"){

backspace();

e.preventDefault();

return;
}


if(e.key==="Tab"){

direction=
direction==="across"
?"down"
:"across";

updateSelection();

e.preventDefault();

return;
}


if(e.key==="ArrowLeft")
move(0,-1);

if(e.key==="ArrowRight")
move(0,1);

if(e.key==="ArrowUp")
move(-1,0);

if(e.key==="ArrowDown")
move(1,0);

}
);


function enterLetter(letter){

const cell=
cells[selectedRow][selectedCol];

if(!cell)
return;

cell.letter=letter;

cell.letterElement.textContent=letter;

cell.element.classList.remove(
"correct",
"wrong"
);

save();

}


function backspace(){

const cell=
cells[selectedRow][selectedCol];

if(cell.letter){

cell.letter="";
cell.letterElement.textContent="";

save();

return;
}

moveBackward();

const previous=
cells[selectedRow][selectedCol];

previous.letter="";
previous.letterElement.textContent="";

save();

}


/* =========================================================
   MOVEMENT
   ========================================================= */

function moveForward(){

const entry=currentEntry();

if(!entry)
return;

const index=
entry.coords.findIndex(
([r,c])=>
r===selectedRow &&
c===selectedCol
);

if(index<entry.coords.length-1){

[
selectedRow,
selectedCol
]=entry.coords[index+1];

updateSelection();

}

}


function moveBackward(){

const entry=currentEntry();

if(!entry)
return;

const index=
entry.coords.findIndex(
([r,c])=>
r===selectedRow &&
c===selectedCol
);

if(index>0){

[
selectedRow,
selectedCol
]=entry.coords[index-1];

updateSelection();

}

}


function move(dr,dc){

let r=selectedRow+dr;
let c=selectedCol+dc;

while(
r>=0&&r<5&&c>=0&&c<5
){

if(solution[r][c]!=="#"){

selectedRow=r;
selectedCol=c;

updateSelection();

return;
}

r+=dr;
c+=dc;

}

}


/* =========================================================
   CHECK
   ========================================================= */

function checkPuzzle(){

let wrong=0;
let empty=0;

for(let row=0;row<5;row++){

for(let col=0;col<5;col++){

if(solution[row][col]==="#")
continue;

const cell=cells[row][col];

cell.element.classList.remove(
"correct",
"wrong"
);

if(!cell.letter){

empty++;
continue;

}

if(
cell.letter===
solution[row][col]
){

cell.element.classList.add(
"correct"
);

}else{

wrong++;

cell.element.classList.add(
"wrong"
);

}

}

}


const status=
document.getElementById("status");


if(wrong){

status.textContent=
`${wrong} incorrect letter${wrong===1?"":"s"}.`;

}else if(empty){

status.textContent=
"So far, so good.";

}else{

status.textContent=
"🎉 Puzzle complete!";

localStorage.setItem(
"complete-"+dateKey,
"1"
);

}

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearPuzzle(){

for(let row=0;row<5;row++){

for(let col=0;col<5;col++){

if(solution[row][col]==="#")
continue;

const cell=cells[row][col];

cell.letter="";
cell.letterElement.textContent="";

cell.element.classList.remove(
"correct",
"wrong"
);

}

}

localStorage.removeItem(
"crossword-"+dateKey
);

document.getElementById(
"status"
).textContent="";

}


/* =========================================================
   REVEAL
   ========================================================= */

function revealPuzzle(){

if(
!confirm("Reveal the entire puzzle?")
)
return;

for(let row=0;row<5;row++){

for(let col=0;col<5;col++){

if(solution[row][col]==="#")
continue;

const cell=cells[row][col];

cell.letter=
solution[row][col];

cell.letterElement.textContent=
solution[row][col];

cell.element.classList.add(
"correct"
);

}

}

save();

document.getElementById(
"status"
).textContent=
"Puzzle revealed.";

}


/* =========================================================
   SAVE / LOAD
   ========================================================= */

function save(){

const data=[];

for(let row=0;row<5;row++){

for(let col=0;col<5;col++){

if(
cells[row][col] &&
cells[row][col].letter
){

data.push([
row,
col,
cells[row][col].letter
]);

}

}

}

localStorage.setItem(
"crossword-"+dateKey,
JSON.stringify(data)
);

}


function load(){

try{

const data=
JSON.parse(
localStorage.getItem(
"crossword-"+dateKey
)
);

if(!Array.isArray(data))
return;

data.forEach(
([row,col,letter])=>{

const cell=
cells[row]?.[col];

if(cell){

cell.letter=letter;

cell.letterElement.textContent=
letter;

}

}
);

}catch(e){}

}


/* =========================================================
   DAILY COUNTDOWN
   ========================================================= */

function updateTimer(){

const current=new Date();

const tomorrow=
new Date(
current.getFullYear(),
current.getMonth(),
current.getDate()+1
);

let seconds=
Math.floor(
(tomorrow-current)/1000
);

const hours=
Math.floor(seconds/3600);

seconds%=3600;

const minutes=
Math.floor(seconds/60);

seconds%=60;

document.getElementById(
"timer"
).textContent=
`Next puzzle in ${
String(hours).padStart(2,"0")
}:${
String(minutes).padStart(2,"0")
}:${
String(seconds).padStart(2,"0")
}`;

}


/* =========================================================
   START
   ========================================================= */

drawGrid();
drawClues();
load();
updateTimer();

setInterval(
updateTimer,
1000
);


/* Select first open square */

outer:
for(let r=0;r<5;r++){

for(let c=0;c<5;c++){

if(solution[r][c]!=="#"){

selectedRow=r;
selectedCol=c;

break outer;

}

}

}

updateSelection();

</script>

</body>
</html>
