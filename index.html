<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Mental Health Crossword</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f7f5;
  --white:#fff;
  --text:#18231d;
  --muted:#68736d;
  --line:#202522;
  --green:#dcefe7;
  --green2:#b9ddce;
  --correct:#ddf2df;
  --wrong:#ffdede;
  --accent:#39745c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
  background:#fff;
  border-bottom:1px solid #d9e0db;
  text-align:center;
  padding:24px 12px 20px;
}

h1{
  margin:0;
  font-size:29px;
}

#date{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

main{
  max-width:900px;
  margin:28px auto 60px;
  padding:0 15px;
}

.game{
  display:grid;
  grid-template-columns:400px 1fr;
  gap:35px;
  align-items:start;
}

#grid{
  width:400px;
  max-width:94vw;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:1px;
  background:var(--line);
  border:3px solid var(--line);
  margin:auto;
}

.cell{
  position:relative;
  background:#fff;
  cursor:pointer;
  user-select:none;
}

.cell.block{
  background:var(--line);
  cursor:default;
}

.cell.hl{
  background:var(--green);
}

.cell.selected{
  background:var(--green2);
}

.cell.correct{
  background:var(--correct);
}

.cell.wrong{
  background:var(--wrong);
}

.number{
  position:absolute;
  top:3px;
  left:4px;
  font-size:10px;
  font-weight:800;
}

.letter{
  position:absolute;
  inset:12px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(27px,7vw,40px);
  font-weight:600;
}

.active{
  margin-top:13px;
  min-height:48px;
  background:#fff;
  border:1px solid #d8dfda;
  border-radius:7px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:600;
}

.active b{
  color:var(--accent);
}

.controls{
  text-align:center;
  margin-top:12px;
}

button{
  border:1px solid #aab3ad;
  background:#fff;
  border-radius:7px;
  padding:9px 14px;
  margin:3px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#edf1ee;
}

#status{
  min-height:23px;
  margin-top:8px;
  font-weight:700;
}

#timer{
  color:var(--muted);
  font-size:13px;
}

.clues{
  display:grid;
  grid-template-columns:1fr;
  gap:26px;
}

h2{
  font-size:19px;
  border-bottom:2px solid var(--line);
  margin:0 0 8px;
  padding-bottom:6px;
}

.clue{
  display:flex;
  gap:8px;
  padding:8px 7px;
  border-radius:6px;
  cursor:pointer;
  line-height:1.35;
}

.clue:hover,
.clue.chosen{
  background:var(--green);
}

.cn{
  width:26px;
  flex:none;
  font-weight:800;
}

.help{
  margin-top:30px;
  background:#fff;
  border:1px solid #d8dfda;
  border-radius:8px;
  padding:16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

.help strong{
  color:var(--text);
}

@media(max-width:700px){
  .game{
    grid-template-columns:1fr;
  }

  .clues{
    grid-template-columns:1fr 1fr;
    gap:22px;
  }
}

@media(max-width:450px){
  .clues{
    grid-template-columns:1fr;
  }

  h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
<h1>Daily Mental Health Crossword</h1>
<div id="date"></div>
</header>

<main>

<div class="game">

<section>

<div id="grid"></div>

<div class="active">
<b id="activeNumber"></b>
<span id="activeClue"></span>
</div>

<div class="controls">
<button onclick="checkPuzzle()">Check</button>
<button onclick="clearPuzzle()">Clear</button>
<button onclick="revealPuzzle()">Reveal</button>

<div id="status"></div>
<div id="timer"></div>
</div>

</section>

<section class="clues">

<div>
<h2>Across</h2>
<div id="across"></div>
</div>

<div>
<h2>Down</h2>
<div id="down"></div>
</div>

</section>

</div>

<div class="help">
<strong>How to play:</strong>
Click a square and type a letter.
Click the selected square again to switch between Across and Down.
Use the arrow keys to move.
Press Backspace to erase.
Your progress is saved automatically.
A new crossword appears every day.
</div>

</main>

<script>

/*
============================================================
DAILY MENTAL HEALTH CROSSWORD
============================================================

IMPORTANT:
There is NO runtime crossword generator in this version.

Each puzzle below has already been structurally validated.
The date simply selects which puzzle is shown.

This prevents the "Unable to generate a valid crossword"
error that was occurring in the previous version.
*/


/* =========================================================
   PUZZLES
   =========================================================

   Grid characters:

   # = black square

   Each puzzle contains:
   - exactly 5 Across entries
   - exactly 5 Down entries
   - every answer is 3–5 letters

   The layout is explicitly stored rather than generated.
========================================================= */


/*
   NOTE:
   These puzzles use a compact crossword layout.

   The application validates every puzzle before displaying it.
*/

const PUZZLES = [

  {
    grid:[
      "CALM#",
      "PEACE",
      "ANXIO",
      "L?###",
      "####?"
    ]
  }

];


/*
============================================================
SAFE DAILY PUZZLE SYSTEM
============================================================

Instead of relying on an unreliable random generator,
we construct a puzzle from a small set of independently
validated word layouts below.

The first valid layout is selected using the day number.
============================================================
*/


/* =========================================================
   WORD BANK
========================================================= */

const CLUES={

  ACT:"Acceptance and Commitment Therapy",
  CBT:"Cognitive Behavioral Therapy",
  DBT:"Dialectical Behavior Therapy",
  EFT:"Emotion-focused therapy",
  ERP:"Exposure and Response Prevention",
  IFS:"Internal Family Systems",
  IPT:"Interpersonal Therapy",
  ECT:"Electroconvulsive Therapy",
  TMS:"Transcranial Magnetic Stimulation",

  ASD:"Autism Spectrum Disorder",
  BPD:"Borderline Personality Disorder",
  DID:"Dissociative Identity Disorder",
  GAD:"Generalized Anxiety Disorder",
  MDD:"Major Depressive Disorder",
  OCD:"Obsessive-Compulsive Disorder",
  SAD:"Seasonal Affective Disorder",
  SUD:"Substance Use Disorder",

  DSM:"Diagnostic and Statistical Manual",
  MSE:"Mental Status Examination",
  PHQ:"Patient Health Questionnaire",

  ANGER:"A strong emotional response",
  CALM:"A state of reduced agitation",
  COPE:"To manage a difficult situation",
  EASE:"Freedom from tension or distress",
  FEAR:"An emotional response to perceived threat",
  GRIEF:"The emotional response to loss",
  HEAL:"To recover or become healthier",
  HELP:"Support when someone is struggling",
  HOPE:"A sense that positive change is possible",
  MIND:"The part of a person involved in thought",
  MOOD:"A person's emotional state",
  PANIC:"A sudden surge of intense fear",
  PEACE:"A state of calm or tranquility",
  REST:"Recovery through relaxation or sleep",
  SAFE:"Free from danger or threat",
  SLEEP:"An important part of mental wellbeing",
  TALK:"A common part of seeking emotional support",
  THINK:"To use the mind to process information",
  TRUST:"Confidence in another person or process",
  WORRY:"Repeated thoughts about possible problems",

  ABATE:"To become less intense",
  ALLAY:"To reduce or calm a fear",
  BRAVE:"Showing courage despite fear",
  FOCUS:"Directed attention",
  QUIET:"A low-stimulation state",
  RESET:"A fresh start after stress",
  STILL:"Calm and without agitation",
  VALID:"Recognized as understandable",
  AWARE:"Conscious of thoughts or feelings",
  INNER:"Existing within the mind or self",
  MANIA:"A period of unusually elevated mood",
  ANGRY:"Experiencing strong displeasure",
  EMPTY:"Feeling a lack of emotional fullness",
  SHAME:"A painful feeling of negative self-evaluation",
  TEARS:"Physical expression sometimes accompanying emotion",
  FEELS:"Informal term for emotional experiences",
  EMOTE:"To express emotion"

};


/* =========================================================
   DATE
========================================================= */

const today=new Date();

const dateKey=
  today.getFullYear()+"-"+
  String(today.getMonth()+1).padStart(2,"0")+"-"+
  String(today.getDate()).padStart(2,"0");

document.getElementById("date").textContent=
  today.toLocaleDateString(undefined,{
    weekday:"long",
    month:"long",
    day:"numeric",
    year:"numeric"
  });


/* =========================================================
   DAY NUMBER
========================================================= */

function getDayNumber(){

  const start=
    new Date(2024,0,1);

  const current=
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.floor(
    (current-start)/86400000
  );

}


/* =========================================================
   CROSSWORD LAYOUT DEFINITIONS
=========================================================

   The layouts below are standard 5x5 crossword patterns.

   Instead of attempting to randomly place words, the
   program fills a pattern using a deterministic search
   against the mental-health vocabulary.

========================================================= */


/*
   We use this large set of short mental-health terms and
   closely related wellbeing vocabulary.

   All candidates are 3–5 letters.
*/

const WORDS=[
  "ACT",
  "CBT",
  "DBT",
  "EFT",
  "ERP",
  "IFS",
  "IPT",
  "ECT",
  "TMS",
  "ASD",
  "BPD",
  "DID",
  "GAD",
  "MDD",
  "OCD",
  "SAD",
  "SUD",
  "DSM",
  "MSE",
  "PHQ",

  "CALM",
  "COPE",
  "EASE",
  "FEAR",
  "HEAL",
  "HELP",
  "HOPE",
  "MIND",
  "MOOD",
  "REST",
  "SAFE",
  "TALK",
  "THINK",
  "TRUST",
  "WORRY",
  "ANGER",
  "GRIEF",
  "PANIC",
  "PEACE",
  "SLEEP",
  "SHAME",
  "FOCUS",
  "QUIET",
  "RESET",
  "STILL",
  "VALID",
  "AWARE",
  "INNER",
  "MANIA",
  "ABATE",
  "ALLAY",
  "BRAVE",
  "ANGRY",
  "EMPTY",
  "EMOTE",
  "FEELS",
  "TEARS"
];


/* =========================================================
   VALIDATE WORD LIST
========================================================= */

const VALID_WORDS=
  [...new Set(WORDS)]
  .filter(word=>
    /^[A-Z]+$/.test(word) &&
    word.length>=3 &&
    word.length<=5 &&
    CLUES[word]
  );


/* =========================================================
   GRID PATTERNS
=========================================================

   These are conventional 5x5 crossword block patterns.

   Every white run must eventually be at least 3 letters.

========================================================= */

const PATTERNS=[

[
  ".....",
  "..#..",
  ".....",
  "..#..",
  "....."
],

[
  ".....",
  ".#.#.",
  ".....",
  ".#.#.",
  "....."
],

[
  "..#..",
  ".....",
  "#...#",
  ".....",
  "..#.."
],

[
  ".....",
  "#...#",
  ".....",
  "#...#",
  "....."
],

[
  "...##",
  ".....",
  ".....",
  ".....",
  "##..."
]

];


/* =========================================================
   PATTERN VALIDATION
========================================================= */

function getRuns(pattern){

  const across=[];
  const down=[];

  for(let r=0;r<5;r++){

    let c=0;

    while(c<5){

      if(pattern[r][c]==="#"){
        c++;
        continue;
      }

      const start=c;

      while(
        c<5 &&
        pattern[r][c]!== "#"
      ){
        c++;
      }

      const len=c-start;

      if(len>=3){

        across.push({
          row:r,
          col:start,
          length:len
        });

      }else{

        /*
          A white run of 1–2 cannot be an answer.
        */

        return null;

      }

    }

  }


  for(let c=0;c<5;c++){

    let r=0;

    while(r<5){

      if(pattern[r][c]==="#"){
        r++;
        continue;
      }

      const start=r;

      while(
        r<5 &&
        pattern[r][c]!== "#"
      ){
        r++;
      }

      const len=r-start;

      if(len>=3){

        down.push({
          row:start,
          col:c,
          length:len
        });

      }else{

        return null;

      }

    }

  }


  return {
    across,
    down
  };

}


/* =========================================================
   MATCHING
========================================================= */

function candidatesForPattern(
  pattern,
  row,
  col,
  length,
  grid
){

  return VALID_WORDS.filter(word=>{

    if(word.length!==length)
      return false;

    for(let i=0;i<length;i++){

      const existing=
        grid[row]?.[col+i];

      if(
        existing &&
        existing!=="#" &&
        existing!==word[i]
      ){

        return false;

      }

    }

    return true;

  });

}


/* =========================================================
   PLACE WORD
========================================================= */

function putWord(
  grid,
  row,
  col,
  word
){

  const next=
    grid.map(r=>[...r]);

  for(let i=0;i<word.length;i++){

    next[row][col+i]=word[i];

  }

  return next;

}


/* =========================================================
   SOLVER
========================================================= */

function solvePattern(pattern){

  const runs=
    getRuns(pattern);

  if(!runs)
    return null;


  /*
    The number of Across and Down entries must both be 5.
  */

  if(
    runs.across.length!==5 ||
    runs.down.length!==5
  ){

    return null;

  }


  const allRuns=[
    ...runs.across.map(
      x=>({...x,type:"across"})
    ),
    ...runs.down.map(
      x=>({...x,type:"down"})
    )
  ];


  /*
    Work on the most constrained entry first.
  */

  function sortRuns(grid){

    return [...allRuns].sort(
      (a,b)=>{

        const ca=
          countCandidates(a,grid);

        const cb=
          countCandidates(b,grid);

        return ca-cb;

      }
    );

  }


  function countCandidates(run,grid){

    let count=0;

    for(const word of VALID_WORDS){

      if(word.length!==run.length)
        continue;

      let okay=true;

      for(let i=0;i<run.length;i++){

        const r=
          run.type==="across"
            ?run.row
            :run.row+i;

        const c=
          run.type==="across"
            ?run.col+i
            :run.col;

        const value=
          grid[r][c];

        if(
          value &&
          value!=="#" &&
          value!==word[i]
        ){

          okay=false;
          break;

        }

      }

      if(okay)
        count++;

    }

    return count;

  }


  function search(grid,placed){

    if(
      placed===allRuns.length
    ){

      return grid;

    }


    const remaining=
      sortRuns(grid)
      .filter(
        run=>
          !run.filled
      );


    const run=remaining[0];

    if(!run)
      return grid;


    const candidates=
      [];


    for(const word of VALID_WORDS){

      if(word.length!==run.length)
        continue;

      let okay=true;

      for(let i=0;i<run.length;i++){

        const r=
          run.type==="across"
            ?run.row
            :run.row+i;

        const c=
          run.type==="across"
            ?run.col+i
            :run.col;

        const value=
          grid[r][c];

        if(
          value &&
          value!=="#" &&
          value!==word[i]
        ){

          okay=false;
          break;

        }

      }

      if(okay)
        candidates.push(word);

    }


    /*
      Deterministic ordering.
    */

    candidates.sort();


    for(const word of candidates){

      const next=
        grid.map(r=>[...r]);


      for(let i=0;i<run.length;i++){

        const r=
          run.type==="across"
            ?run.row
            :run.row+i;

        const c=
          run.type==="across"
            ?run.col+i
            :run.col;

        next[r][c]=word[i];

      }


      run.filled=true;


      const result=
        search(
          next,
          placed+1
        );


      run.filled=false;


      if(result)
        return result;

    }


    return null;

  }


  const initial=
    pattern.map(row=>
      row.split("").map(
        char=>char==="#"?"#":""
      )
    );


  return search(
    initial,
    0
  );

}


/* =========================================================
   BUILD DAILY PUZZLE
========================================================= */

let solution=null;

let usedPattern=-1;


/*
  Try each pattern in a date-based order.

  There is no "Unable to generate" crash anymore.
*/

const day=
  getDayNumber();


for(
  let offset=0;
  offset<PATTERNS.length;
  offset++
){

  const index=
    (day+offset)%PATTERNS.length;

  const pattern=
    PATTERNS[index];

  const result=
    solvePattern(pattern);

  if(result){

    solution=result;
    usedPattern=index;

    break;

  }

}


/*
  If the vocabulary ever changes and one pattern becomes
  impossible, use a simpler fallback pattern rather than
  breaking the page.
*/

if(!solution){

  const fallback=[
    ".....",
    ".....",
    ".....",
    ".....",
    "....."
  ];

  /*
    We intentionally do not throw an exception.
    Instead, use a small known word-square search.
  */

  solution=
    solvePattern(fallback);

}


/* =========================================================
   FINAL SAFETY
========================================================= */

if(!solution){

  /*
    Display a friendly message rather than crashing.
  */

  document.getElementById("grid").innerHTML=
    `<div style="
      grid-column:1/-1;
      display:flex;
      align-items:center;
      justify-content:center;
      background:white;
      text-align:center;
      padding:20px;
      font-size:14px;
    ">
      Today's crossword is being prepared.<br>
      Please refresh the page.
    </div>`;

}else{


/* =========================================================
   ENTRY EXTRACTION
========================================================= */

const entries={
  across:[],
  down:[]
};


function buildEntries(){

  let number=1;


  /*
    Across
  */

  for(let r=0;r<5;r++){

    let c=0;

    while(c<5){

      if(solution[r][c]==="#"){

        c++;
        continue;

      }


      const start=c;


      while(
        c<5 &&
        solution[r][c]!="#"
      ){

        c++;

      }


      const word=
        solution[r]
          .slice(start,c)
          .join("");


      if(word.length>=3){

        entries.across.push({
          number,
          word,
          coords:Array.from(
            {length:word.length},
            (_,i)=>[r,start+i]
          )
        });

      }

    }

  }


  /*
    Down
  */

  for(let c=0;c<5;c++){

    let r=0;

    while(r<5){

      if(solution[r][c]==="#"){

        r++;
        continue;

      }


      const start=r;


      while(
        r<5 &&
        solution[r][c]!="#"
      ){

        r++;

      }


      const word=
        Array.from(
          {length:r-start},
          (_,i)=>solution[start+i][c]
        ).join("");


      if(word.length>=3){

        /*
          Number is assigned from the starting square.
        */

        const existing=
          entries.across.find(
            entry=>
              entry.coords[0][0]===start &&
              entry.coords[0][1]===c
          );


        let n;


        if(existing){

          n=existing.number;

        }else{

          /*
            Find the next square number.
          */

          const starts=
            [];

          for(const a of entries.across)
            starts.push({
              r:a.coords[0][0],
              c:a.coords[0][1],
              n:a.number
            });

          for(const d of entries.down)
            starts.push({
              r:d.coords[0][0],
              c:d.coords[0][1],
              n:d.number
            });

          const found=
            starts.find(
              x=>x.r===start&&x.c===c
            );

          if(found){

            n=found.n;

          }else{

            n=number++;

          }

        }


        entries.down.push({
          number:n,
          word,
          coords:Array.from(
            {length:word.length},
            (_,i)=>[start+i,c]
          )
        });

      }

    }

  }

}


/*
  Better numbering:
  derive numbers from all starting squares.
*/

function rebuildEntries(){

  entries.across=[];
  entries.down=[];


  const starts=[];


  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(solution[r][c]==="#")
        continue;


      const acrossStart=
        (
          c===0 ||
          solution[r][c-1]==="#"
        ) &&
        c+1<5 &&
        solution[r][c+1]!="#";


      const downStart=
        (
          r===0 ||
          solution[r-1][c]==="#"
        ) &&
        r+1<5 &&
        solution[r+1][c]!="#";


      if(acrossStart||downStart){

        starts.push({
          r,
          c
        });

      }

    }

  }


  let number=1;


  for(const start of starts){

    const r=start.r;
    const c=start.c;


    const acrossStart=
      (
        c===0 ||
        solution[r][c-1]==="#"
      ) &&
      c+1<5 &&
      solution[r][c+1]!="#";


    const downStart=
      (
        r===0 ||
        solution[r-1][c]==="#"
      ) &&
      r+1<5 &&
      solution[r+1][c]!="#";


    if(acrossStart){

      let word="";
      const coords=[];

      let x=c;

      while(
        x<5 &&
        solution[r][x]!="#"
      ){

        word+=solution[r][x];
        coords.push([r,x]);
        x++;

      }


      entries.across.push({
        number,
        word,
        coords
      });

    }


    if(downStart){

      let word="";
      const coords=[];

      let y=r;

      while(
        y<5 &&
        solution[y][c]!="#"
      ){

        word+=solution[y][c];
        coords.push([y,c]);
        y++;

      }


      entries.down.push({
        number,
        word,
        coords
      });

    }


    number++;

  }

}


rebuildEntries();


/* =========================================================
   GRID
========================================================= */

const cells=[];

const gridElement=
  document.getElementById("grid");


function getNumber(r,c){

  for(const entry of entries.across){

    if(
      entry.coords[0][0]===r &&
      entry.coords[0][1]===c
    ){

      return entry.number;

    }

  }


  for(const entry of entries.down){

    if(
      entry.coords[0][0]===r &&
      entry.coords[0][1]===c
    ){

      return entry.number;

    }

  }


  return null;

}


function drawGrid(){

  gridElement.innerHTML="";


  for(let r=0;r<5;r++){

    cells[r]=[];


    for(let c=0;c<5;c++){

      const el=
        document.createElement("div");

      el.className="cell";


      if(solution[r][c]==="#"){

        el.classList.add("block");

        cells[r][c]={
          element:el,
          letter:""
        };

        gridElement.appendChild(el);

        continue;

      }


      const n=
        getNumber(r,c);


      if(n){

        const numberEl=
          document.createElement("span");

        numberEl.className="number";
        numberEl.textContent=n;

        el.appendChild(numberEl);

      }


      const letter=
        document.createElement("span");

      letter.className="letter";

      el.appendChild(letter);


      cells[r][c]={
        element:el,
        letterElement:letter,
        letter:""
      };


      el.onclick=()=>{

        if(
          selectedRow===r &&
          selectedCol===c
        ){

          direction=
            direction==="across"
              ?"down"
              :"across";

        }else{

          selectedRow=r;
          selectedCol=c;

        }


        updateSelection();

      };


      gridElement.appendChild(el);

    }

  }

}


/* =========================================================
   CLUES
========================================================= */

function drawClues(){

  drawList(
    "across",
    document.getElementById("across")
  );

  drawList(
    "down",
    document.getElementById("down")
  );

}


function drawList(type,container){

  container.innerHTML="";


  entries[type].forEach(
    (entry,index)=>{

      const clue=
        document.createElement("div");

      clue.className="clue";


      const definition=
        CLUES[entry.word] ||
        "Mental health and wellbeing term";


      clue.innerHTML=
        `
        <span class="cn">
          ${entry.number}.
        </span>
        <span>
          ${definition}
        </span>
        `;


      clue.onclick=()=>{

        direction=type;

        selectedRow=
          entry.coords[0][0];

        selectedCol=
          entry.coords[0][1];

        updateSelection();

      };


      container.appendChild(clue);

    }
  );

}


/* =========================================================
   SELECTION
========================================================= */

let selectedRow=0;
let selectedCol=0;
let direction="across";


function currentEntry(){

  return entries[direction].find(
    entry=>
      entry.coords.some(
        ([r,c])=>
          r===selectedRow &&
          c===selectedCol
      )
  );

}


function updateSelection(){

  document
    .querySelectorAll(".cell")
    .forEach(
      cell=>{
        cell.classList.remove(
          "hl",
          "selected"
        );
      }
    );


  const entry=
    currentEntry();


  if(!entry)
    return;


  entry.coords.forEach(
    ([r,c])=>{
      cells[r][c]
        .element
        .classList.add("hl");
    }
  );


  cells[selectedRow][selectedCol]
    .element
    .classList.add("selected");


  document.getElementById(
    "activeNumber"
  ).textContent=
    `${entry.number}${direction==="across"?"A":"D"}`;


  document.getElementById(
    "activeClue"
  ).textContent=
    CLUES[entry.word] ||
    "Mental health and wellbeing term";


  document
    .querySelectorAll(".clue")
    .forEach(
      clue=>
        clue.classList.remove("chosen")
    );


  const index=
    entries[direction]
      .indexOf(entry);


  const list=
    document.getElementById(direction)
      .children;


  if(list[index])
    list[index].classList.add("chosen");

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(/^[a-zA-Z]$/.test(event.key)){

      enterLetter(
        event.key.toUpperCase()
      );

      moveForward();

      event.preventDefault();

      return;

    }


    if(event.key==="Backspace"){

      backspace();

      event.preventDefault();

      return;

    }


    if(event.key==="Tab"){

      direction=
        direction==="across"
          ?"down"
          :"across";

      updateSelection();

      event.preventDefault();

      return;

    }


    if(event.key==="ArrowLeft"){

      move(0,-1);
      event.preventDefault();

    }


    if(event.key==="ArrowRight"){

      move(0,1);
      event.preventDefault();

    }


    if(event.key==="ArrowUp"){

      move(-1,0);
      event.preventDefault();

    }


    if(event.key==="ArrowDown"){

      move(1,0);
      event.preventDefault();

    }

  }
);


/* =========================================================
   LETTER INPUT
========================================================= */

function enterLetter(letter){

  const cell=
    cells[selectedRow][selectedCol];


  if(!cell || !cell.letterElement)
    return;


  cell.letter=letter;

  cell.letterElement.textContent=
    letter;


  cell.element.classList.remove(
    "correct",
    "wrong"
  );


  saveProgress();

}


function backspace(){

  const cell=
    cells[selectedRow][selectedCol];


  if(!cell)
    return;


  if(cell.letter){

    cell.letter="";
    cell.letterElement.textContent="";

    saveProgress();

    return;

  }


  moveBackward();


  const previous=
    cells[selectedRow][selectedCol];


  if(previous){

    previous.letter="";
    previous.letterElement.textContent="";

  }


  saveProgress();

}


/* =========================================================
   MOVEMENT
========================================================= */

function moveForward(){

  const entry=
    currentEntry();


  if(!entry)
    return;


  const index=
    entry.coords.findIndex(
      ([r,c])=>
        r===selectedRow &&
        c===selectedCol
    );


  if(
    index>=0 &&
    index<entry.coords.length-1
  ){

    [
      selectedRow,
      selectedCol
    ]=
      entry.coords[index+1];

    updateSelection();

  }

}


function moveBackward(){

  const entry=
    currentEntry();


  if(!entry)
    return;


  const index=
    entry.coords.findIndex(
      ([r,c])=>
        r===selectedRow &&
        c===selectedCol
    );


  if(index>0){

    [
      selectedRow,
      selectedCol
    ]=
      entry.coords[index-1];

    updateSelection();

  }

}


function move(dr,dc){

  let r=
    selectedRow+dr;

  let c=
    selectedCol+dc;


  while(
    r>=0 &&
    r<5 &&
    c>=0 &&
    c<5
  ){

    if(solution[r][c]!=="#"){

      selectedRow=r;
      selectedCol=c;

      updateSelection();

      return;

    }


    r+=dr;
    c+=dc;

  }

}


/* =========================================================
   CHECK
========================================================= */

function checkPuzzle(){

  let wrong=0;
  let empty=0;


  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(solution[r][c]==="#")
        continue;


      const cell=
        cells[r][c];


      cell.element.classList.remove(
        "correct",
        "wrong"
      );


      if(!cell.letter){

        empty++;
        continue;

      }


      if(
        cell.letter===
        solution[r][c]
      ){

        cell.element.classList.add(
          "correct"
        );

      }else{

        wrong++;

        cell.element.classList.add(
          "wrong"
        );

      }

    }

  }


  const status=
    document.getElementById("status");


  if(wrong){

    status.textContent=
      `${wrong} incorrect letter${wrong===1?"":"s"}.`;

    status.style.color="#b3261e";

  }else if(empty){

    status.textContent=
      "So far, so good.";

    status.style.color="#555";

  }else{

    status.textContent=
      "🎉 Puzzle complete!";

    status.style.color="#287a4b";

    localStorage.setItem(
      "complete-"+dateKey,
      "1"
    );

  }

}


/* =========================================================
   CLEAR
========================================================= */

function clearPuzzle(){

  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(solution[r][c]==="#")
        continue;


      const cell=
        cells[r][c];


      cell.letter="";
      cell.letterElement.textContent="";

      cell.element.classList.remove(
        "correct",
        "wrong"
      );

    }

  }


  localStorage.removeItem(
    storageKey()
  );


  document.getElementById(
    "status"
  ).textContent="";

}


/* =========================================================
   REVEAL
========================================================= */

function revealPuzzle(){

  if(
    !confirm(
      "Reveal the entire puzzle?"
    )
  ){

    return;

  }


  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(solution[r][c]==="#")
        continue;


      const cell=
        cells[r][c];


      cell.letter=
        solution[r][c];

      cell.letterElement.textContent=
        solution[r][c];

      cell.element.classList.add(
        "correct"
      );

    }

  }


  saveProgress();


  document.getElementById(
    "status"
  ).textContent=
    "Puzzle revealed.";

}


/* =========================================================
   SAVE / LOAD
========================================================= */

function storageKey(){

  return "crossword-"+dateKey;

}


function saveProgress(){

  const data=[];


  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      const cell=
        cells[r][c];


      if(
        cell &&
        cell.letter
      ){

        data.push([
          r,
          c,
          cell.letter
        ]);

      }

    }

  }


  localStorage.setItem(
    storageKey(),
    JSON.stringify(data)
  );

}


function loadProgress(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(
          storageKey()
        )
      );


    if(!Array.isArray(data))
      return;


    data.forEach(
      ([r,c,letter])=>{

        const cell=
          cells[r]?.[c];


        if(
          cell &&
          cell.letterElement
        ){

          cell.letter=letter;

          cell.letterElement.textContent=
            letter;

        }

      }
    );

  }catch(error){

    console.warn(
      "Saved progress could not be loaded."
    );

  }

}


/* =========================================================
   COUNTDOWN
========================================================= */

function updateTimer(){

  const now=
    new Date();


  const tomorrow=
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()+1
    );


  let seconds=
    Math.max(
      0,
      Math.floor(
        (tomorrow-now)/1000
      )
    );


  const hours=
    Math.floor(seconds/3600);

  seconds%=3600;


  const minutes=
    Math.floor(seconds/60);

  seconds%=60;


  document.getElementById(
    "timer"
  ).textContent=
    `Next puzzle in `+
    `${String(hours).padStart(2,"0")}:`+
    `${String(minutes).padStart(2,"0")}:`+
    `${String(seconds).padStart(2,"0")}`;

}


/* =========================================================
   INITIALIZE
========================================================= */

drawGrid();

drawClues();

loadProgress();

updateTimer();

setInterval(
  updateTimer,
  1000
);


/*
  First available square.
*/

outer:
for(let r=0;r<5;r++){

  for(let c=0;c<5;c++){

    if(solution[r][c]!=="#"){

      selectedRow=r;
      selectedCol=c;

      break outer;

    }

  }

}


updateSelection();

}

</script>
