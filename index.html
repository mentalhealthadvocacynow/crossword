<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Crossword</title>

<style>
:root {
  --bg: #f7f7f5;
  --card: #ffffff;
  --text: #171717;
  --muted: #777;
  --border: #222;
  --blue: #cfe5ff;
  --blue-dark: #9fc8f5;
  --green: #d9f2d7;
  --wrong: #ffd8d8;
  --black: #1d1d1d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

header {
  background: white;
  border-bottom: 1px solid #ddd;
  text-align: center;
  padding: 24px 15px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 750;
}

#today {
  margin-top: 6px;
  color: var(--muted);
  font-size: 14px;
}

main {
  width: min(900px, 94vw);
  margin: 28px auto 60px;
}

.game {
  display: grid;
  grid-template-columns: minmax(280px, 420px) 1fr;
  gap: 36px;
  align-items: start;
}

/* =========================
   GRID
========================= */

.board-wrapper {
  width: 100%;
}

#grid {
  width: min(420px, 94vw);
  aspect-ratio: 1;
  margin: auto;

  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(5, 1fr);

  gap: 1px;
  background: var(--border);

  border: 3px solid var(--border);
}

.cell {
  position: relative;
  background: white;
  cursor: pointer;
  user-select: none;
}

.cell.block {
  background: var(--black);
  cursor: default;
}

.cell.word-highlight {
  background: #e4f0ff;
}

.cell.selected {
  background: var(--blue);
}

.cell.correct {
  background: var(--green);
}

.cell.wrong {
  background: var(--wrong);
}

.cell-number {
  position: absolute;
  top: 3px;
  left: 4px;

  font-size: 11px;
  font-weight: 700;
  line-height: 1;

  z-index: 2;
}

.cell-letter {
  position: absolute;
  inset: 12px 0 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(27px, 7vw, 40px);
  font-weight: 600;
}

/* =========================
   ACTIVE CLUE
========================= */

.active-clue {
  margin-top: 14px;
  min-height: 48px;

  padding: 11px 14px;

  background: white;
  border: 1px solid #ddd;
  border-radius: 7px;

  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 15px;
}

.active-clue-number {
  font-weight: 800;
}

.active-clue-text {
  font-weight: 600;
}

/* =========================
   CONTROLS
========================= */

.controls {
  text-align: center;
  margin-top: 15px;
}

button {
  appearance: none;

  border: 1px solid #aaa;
  border-radius: 7px;

  background: white;
  color: #222;

  padding: 9px 15px;

  margin: 3px;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
}

button:hover {
  background: #eeeeee;
}

#status {
  min-height: 24px;
  margin-top: 9px;
  font-weight: 700;
}

#countdown {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
}

/* =========================
   CLUES
========================= */

.clues {
  display: grid;
  grid-template-columns: 1fr;
  gap: 25px;
}

.clue-section h2 {
  margin: 0 0 9px;

  font-size: 19px;

  border-bottom: 2px solid #222;
  padding-bottom: 7px;
}

.clue {
  display: flex;
  gap: 9px;

  padding: 8px 7px;

  border-radius: 6px;

  cursor: pointer;

  line-height: 1.35;
}

.clue:hover {
  background: #ebe9e4;
}

.clue.active {
  background: var(--blue);
}

.clue-number {
  min-width: 25px;
  font-weight: 800;
}

/* =========================
   HELP
========================= */

.help {
  margin-top: 32px;

  padding: 16px 18px;

  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;

  color: #666;

  font-size: 14px;
  line-height: 1.55;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header h1 {
    font-size: 26px;
  }

  main {
    margin-top: 18px;
  }

  .game {
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .clues {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 480px) {

  .clues {
    grid-template-columns: 1fr;
  }

  #grid {
    width: 94vw;
  }
}
</style>
</head>

<body>

<header>

  <h1>Daily Crossword</h1>

  <div id="today"></div>

</header>

<main>

  <div class="game">

    <section class="board-wrapper">

      <div id="grid"></div>

      <div class="active-clue">

        <span
          id="activeNumber"
          class="active-clue-number">
        </span>

        <span
          id="activeClue"
          class="active-clue-text">
        </span>

      </div>

      <div class="controls">

        <button onclick="checkPuzzle()">
          Check
        </button>

        <button onclick="clearPuzzle()">
          Clear
        </button>

        <button onclick="revealPuzzle()">
          Reveal
        </button>

        <div id="status"></div>

        <div id="countdown"></div>

      </div>

    </section>


    <section class="clues">

      <div class="clue-section">

        <h2>Across</h2>

        <div id="acrossClues"></div>

      </div>

      <div class="clue-section">

        <h2>Down</h2>

        <div id="downClues"></div>

      </div>

    </section>

  </div>


  <div class="help">

    <strong>How to play:</strong>
    Click a square to select it. Click the same square again
    to switch between Across and Down. Type a letter to fill a
    square. Use the arrow keys to move around the puzzle.

    <br><br>

    A new crossword is released every day.

  </div>

</main>


<script>

/* ============================================================
   DAILY PUZZLES
   ============================================================

   # = black square

   IMPORTANT:
   The clues are stored in the SAME ORDER as the entries
   generated from the grid.

   Every puzzle is validated when loaded.

   Minimum answer length = 3.
============================================================ */


/*
   PUZZLE 1

   Grid:

   LAB##
   LINUS
   AGGRO
   SHELL
   TRY##

   Across:
   LAB
   LINUS
   AGGRO
   SHELL
   TRY

   Down:
   LIGHT
   ANGER
   BURLY
   LAS
   SOL
*/

const puzzles = [

  {
    id: "daily-001",

    grid: [
      "LAB##",
      "LINUS",
      "AGGRO",
      "SHELL",
      "TRY##"
    ],

    across: [
      {
        clue: "Scientist's workplace"
      },
      {
        clue: "A thoughtful Peanuts character"
      },
      {
        clue: "Ready to start a fight, informally"
      },
      {
        clue: "Protective covering of a turtle"
      },
      {
        clue: "Make an attempt"
      }
    ],

    down: [
      {
        clue: "What plants use as an energy source"
      },
      {
        clue: "Strong feeling of annoyance"
      },
      {
        clue: "Large and muscular"
      },
      {
        clue: "___ Vegas"
      },
      {
        clue: "Solfège note after fa"
      }
    ]
  },


  /*
     PUZZLE 2

     Same valid 5/5 structure.
  */

  {
    id: "daily-002",

    grid: [
      "CAT##",
      "ALONE",
      "TREND",
      "SPEAK",
      "RAT##"
    ],

    across: [
      {
        clue: "Furry household pet"
      },
      {
        clue: "By oneself"
      },
      {
        clue: "Popular direction or tendency"
      },
      {
        clue: "Use your voice"
      },
      {
        clue: "Small rodent"
      }
    ],

    down: [
      {
        clue: "Animal that says meow"
      },
      {
        clue: "Without company"
      },
      {
        clue: "Current popular tendency"
      },
      {
        clue: "Express in words"
      },
      {
        clue: "Small rodent"
      }
    ]
  },


  /*
     PUZZLE 3
  */

  {
    id: "daily-003",

    grid: [
      "SUN##",
      "EARTH",
      "APPLE",
      "STONE",
      "SEA##"
    ],

    across: [
      {
        clue: "Star at the center of our system"
      },
      {
        clue: "Planet we live on"
      },
      {
        clue: "Fruit often associated with teachers"
      },
      {
        clue: "Small piece of rock"
      },
      {
        clue: "Large body of salt water"
      }
    ],

    down: [
      {
        clue: "Daytime source of light"
      },
      {
        clue: "Our home planet"
      },
      {
        clue: "Common red or green fruit"
      },
      {
        clue: "Hard mineral material"
      },
      {
        clue: "Ocean, for example"
      }
    ]
  }

];


/* ============================================================
   DATE
============================================================ */

function getDateKey() {

  const now = new Date();

  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
}


const dateKey = getDateKey();


/* ============================================================
   DAILY PUZZLE SELECTION
============================================================ */

function getDayNumber() {

  const start =
    new Date(2026, 0, 1);

  const today =
    new Date();

  const startDay =
    new Date(
      start.getFullYear(),
      start.getMonth(),
      start.getDate()
    );

  const todayDay =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.floor(
    (todayDay - startDay) /
    86400000
  );
}


function getDailyPuzzle() {

  const day =
    getDayNumber();

  return puzzles[
    ((day % puzzles.length) +
      puzzles.length) %
    puzzles.length
  ];
}


const puzzle =
  getDailyPuzzle();


/* ============================================================
   VALIDATION
============================================================ */

function validatePuzzle() {

  if (
    !Array.isArray(puzzle.grid) ||
    puzzle.grid.length !== 5
  ) {
    throw new Error(
      "Puzzle must contain 5 rows."
    );
  }

  for (const row of puzzle.grid) {

    if (
      typeof row !== "string" ||
      row.length !== 5
    ) {
      throw new Error(
        "Every puzzle row must be 5 characters."
      );
    }
  }

  buildEntries();

  if (entries.across.length !== 5) {

    throw new Error(
      "Puzzle must contain exactly 5 Across entries. Found " +
      entries.across.length
    );
  }

  if (entries.down.length !== 5) {

    throw new Error(
      "Puzzle must contain exactly 5 Down entries. Found " +
      entries.down.length
    );
  }

  for (const entry of [
    ...entries.across,
    ...entries.down
  ]) {

    if (entry.answer.length < 3) {

      throw new Error(
        `Invalid ${entry.direction} entry #${entry.number}: ` +
        `${entry.answer}. Minimum length is 3.`
      );
    }

    if (entry.answer.length > 5) {

      throw new Error(
        `Invalid entry #${entry.number}: maximum length is 5.`
      );
    }
  }

  if (
    puzzle.across.length !==
    entries.across.length
  ) {
    throw new Error(
      "Across clue count does not match grid."
    );
  }

  if (
    puzzle.down.length !==
    entries.down.length
  ) {
    throw new Error(
      "Down clue count does not match grid."
    );
  }
}


/* ============================================================
   ENTRY GENERATION
============================================================ */

const SIZE = 5;

let entries = {
  across: [],
  down: []
};


function buildEntries() {

  entries = {
    across: [],
    down: []
  };

  let number = 1;

  for (let row = 0; row < SIZE; row++) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      if (
        puzzle.grid[row][col] === "#"
      ) {
        continue;
      }


      const acrossStart =
        (
          col === 0 ||
          puzzle.grid[row][col - 1] === "#"
        ) &&
        (
          col + 1 < SIZE &&
          puzzle.grid[row][col + 1] !== "#"
        );


      const downStart =
        (
          row === 0 ||
          puzzle.grid[row - 1][col] === "#"
        ) &&
        (
          row + 1 < SIZE &&
          puzzle.grid[row + 1][col] !== "#"
        );


      let hasEntry = false;


      if (acrossStart) {

        const coords = [];

        let answer = "";

        let c = col;

        while (
          c < SIZE &&
          puzzle.grid[row][c] !== "#"
        ) {

          coords.push([row, c]);

          answer +=
            puzzle.grid[row][c];

          c++;
        }

        entries.across.push({

          number,

          direction: "across",

          answer,

          coords

        });

        hasEntry = true;
      }


      if (downStart) {

        const coords = [];

        let answer = "";

        let r = row;

        while (
          r < SIZE &&
          puzzle.grid[r][col] !== "#"
        ) {

          coords.push([r, col]);

          answer +=
            puzzle.grid[r][col];

          r++;
        }

        entries.down.push({

          number,

          direction: "down",

          answer,

          coords

        });

        hasEntry = true;
      }


      if (hasEntry) {
        number++;
      }
    }
  }
}


/* ============================================================
   GAME STATE
============================================================ */

let cells = [];

let selectedRow = 0;

let selectedCol = 0;

let direction = "across";


function progressKey() {

  return (
    "daily-crossword-" +
    dateKey +
    "-" +
    puzzle.id
  );
}


/* ============================================================
   BUILD GRID
============================================================ */

function drawGrid() {

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  cells = [];

  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    cells[row] = [];

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      const cell =
        document.createElement("div");

      cell.className = "cell";


      if (
        puzzle.grid[row][col] === "#"
      ) {

        cell.classList.add("block");

        cells[row][col] = {
          element: cell,
          letter: "",
          letterElement: null
        };

        grid.appendChild(cell);

        continue;
      }


      const number =
        getCellNumber(row, col);


      if (number !== null) {

        const numberElement =
          document.createElement("div");

        numberElement.className =
          "cell-number";

        numberElement.textContent =
          number;

        cell.appendChild(numberElement);
      }


      const letter =
        document.createElement("div");

      letter.className =
        "cell-letter";

      cell.appendChild(letter);


      cells[row][col] = {

        element: cell,

        letter: "",

        letterElement: letter
      };


      cell.addEventListener(
        "click",
        () => {

          if (
            selectedRow === row &&
            selectedCol === col
          ) {

            direction =
              direction === "across"
                ? "down"
                : "across";

          } else {

            selectedRow = row;
            selectedCol = col;
          }

          updateSelection();
        }
      );


      grid.appendChild(cell);
    }
  }
}


function getCellNumber(row, col) {

  for (
    const entry of entries.across
  ) {

    if (
      entry.coords[0][0] === row &&
      entry.coords[0][1] === col
    ) {

      return entry.number;
    }
  }


  for (
    const entry of entries.down
  ) {

    if (
      entry.coords[0][0] === row &&
      entry.coords[0][1] === col
    ) {

      return entry.number;
    }
  }


  return null;
}


/* ============================================================
   CLUES
============================================================ */

function drawClues() {

  drawClueSection(
    "across",
    entries.across,
    puzzle.across,
    document.getElementById(
      "acrossClues"
    )
  );


  drawClueSection(
    "down",
    entries.down,
    puzzle.down,
    document.getElementById(
      "downClues"
    )
  );
}


function drawClueSection(
  directionName,
  entryList,
  clueList,
  container
) {

  container.innerHTML = "";


  entryList.forEach(
    (entry, index) => {

      const clue =
        document.createElement("div");

      clue.className = "clue";

      clue.dataset.direction =
        directionName;

      clue.dataset.number =
        entry.number;


      const number =
        document.createElement("span");

      number.className =
        "clue-number";

      number.textContent =
        entry.number + ".";


      const text =
        document.createElement("span");

      text.textContent =
        clueList[index].clue;


      clue.appendChild(number);

      clue.appendChild(text);


      clue.addEventListener(
        "click",
        () => {

          direction =
            directionName;

          selectedRow =
            entry.coords[0][0];

          selectedCol =
            entry.coords[0][1];

          updateSelection();
        }
      );


      container.appendChild(clue);
    }
  );
}


/* ============================================================
   FIND CURRENT ENTRY
============================================================ */

function getCurrentEntry() {

  const list =
    entries[direction];


  return list.find(
    entry =>
      entry.coords.some(
        ([row, col]) =>
          row === selectedRow &&
          col === selectedCol
      )
  );
}


/* ============================================================
   SELECTION
============================================================ */

function updateSelection() {

  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      const element =
        cells[row][col]?.element;

      if (!element) continue;

      element.classList.remove(
        "selected",
        "word-highlight"
      );
    }
  }


  const entry =
    getCurrentEntry();


  if (!entry) return;


  for (
    const [row, col]
    of entry.coords
  ) {

    cells[row][col]
      .element
      .classList.add(
        "word-highlight"
      );
  }


  cells[selectedRow][selectedCol]
    .element
    .classList.add("selected");


  const clueIndex =
    direction === "across"
      ? entries.across.indexOf(entry)
      : entries.down.indexOf(entry);


  const clue =
    direction === "across"
      ? puzzle.across[clueIndex]
      : puzzle.down[clueIndex];


  document.getElementById(
    "activeNumber"
  ).textContent =
    entry.number +
    (direction === "across"
      ? "A"
      : "D");


  document.getElementById(
    "activeClue"
  ).textContent =
    clue.clue;


  document
    .querySelectorAll(".clue")
    .forEach(element => {

      element.classList.remove(
        "active"
      );

      if (
        element.dataset.direction ===
          direction &&
        Number(
          element.dataset.number
        ) === entry.number
      ) {

        element.classList.add(
          "active"
        );
      }
    });
}


/* ============================================================
   INPUT
============================================================ */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key.length === 1 &&
      /^[a-zA-Z]$/.test(event.key)
    ) {

      enterLetter(
        event.key.toUpperCase()
      );

      moveForward();

      event.preventDefault();

      return;
    }


    if (
      event.key === "Backspace"
    ) {

      backspace();

      event.preventDefault();

      return;
    }


    if (
      event.key === " "
    ) {

      direction =
        direction === "across"
          ? "down"
          : "across";

      updateSelection();

      event.preventDefault();

      return;
    }


    if (
      event.key === "ArrowLeft"
    ) {

      move(0, -1);

      event.preventDefault();

      return;
    }


    if (
      event.key === "ArrowRight"
    ) {

      move(0, 1);

      event.preventDefault();

      return;
    }


    if (
      event.key === "ArrowUp"
    ) {

      move(-1, 0);

      event.preventDefault();

      return;
    }


    if (
      event.key === "ArrowDown"
    ) {

      move(1, 0);

      event.preventDefault();

      return;
    }
  }
);


function enterLetter(letter) {

  const cell =
    cells[selectedRow][selectedCol];

  if (
    !cell ||
    puzzle.grid[selectedRow][selectedCol] === "#"
  ) {
    return;
  }


  cell.letter = letter;

  cell.letterElement.textContent =
    letter;

  cell.element.classList.remove(
    "wrong",
    "correct"
  );


  saveProgress();
}


function backspace() {

  const cell =
    cells[selectedRow][selectedCol];

  if (!cell) return;


  if (cell.letter) {

    cell.letter = "";

    cell.letterElement.textContent =
      "";

    saveProgress();

    return;
  }


  moveBackward();


  const previous =
    cells[selectedRow][selectedCol];

  previous.letter = "";

  previous.letterElement.textContent =
    "";

  saveProgress();
}


/* ============================================================
   MOVEMENT
============================================================ */

function moveForward() {

  const entry =
    getCurrentEntry();

  if (!entry) return;


  const index =
    entry.coords.findIndex(
      ([row, col]) =>
        row === selectedRow &&
        col === selectedCol
    );


  if (
    index >= 0 &&
    index < entry.coords.length - 1
  ) {

    const [
      row,
      col
    ] =
      entry.coords[index + 1];

    selectedRow = row;
    selectedCol = col;

    updateSelection();
  }
}


function moveBackward() {

  const entry =
    getCurrentEntry();

  if (!entry) return;


  const index =
    entry.coords.findIndex(
      ([row, col]) =>
        row === selectedRow &&
        col === selectedCol
    );


  if (index > 0) {

    const [
      row,
      col
    ] =
      entry.coords[index - 1];

    selectedRow = row;
    selectedCol = col;

    updateSelection();
  }
}


function move(rowDelta, colDelta) {

  let row =
    selectedRow + rowDelta;

  let col =
    selectedCol + colDelta;


  while (
    row >= 0 &&
    row < SIZE &&
    col >= 0 &&
    col < SIZE
  ) {

    if (
      puzzle.grid[row][col] !== "#"
    ) {

      selectedRow = row;

      selectedCol = col;

      updateSelection();

      return;
    }


    row += rowDelta;

    col += colDelta;
  }
}


/* ============================================================
   CHECK
============================================================ */

function checkPuzzle() {

  let wrong = 0;

  let empty = 0;

  let total = 0;

  let correct = 0;


  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      if (
        puzzle.grid[row][col] === "#"
      ) {
        continue;
      }


      total++;


      const cell =
        cells[row][col];


      cell.element.classList.remove(
        "wrong",
        "correct"
      );


      if (!cell.letter) {

        empty++;

        continue;
      }


      if (
        cell.letter ===
        puzzle.grid[row][col]
      ) {

        correct++;

        cell.element.classList.add(
          "correct"
        );

      } else {

        wrong++;

        cell.element.classList.add(
          "wrong"
        );
      }
    }
  }


  const status =
    document.getElementById(
      "status"
    );


  if (wrong > 0) {

    status.textContent =
      `${wrong} incorrect letter${
        wrong === 1 ? "" : "s"
      }.`;

    status.style.color =
      "#b3261e";

    return;
  }


  if (empty > 0) {

    status.textContent =
      `${correct} of ${total} letters correct.`;

    status.style.color =
      "#555";

    return;
  }


  status.textContent =
    "🎉 Puzzle complete!";

  status.style.color =
    "#218838";


  localStorage.setItem(
    "daily-crossword-complete-" +
    dateKey,
    "true"
  );
}


/* ============================================================
   CLEAR
============================================================ */

function clearPuzzle() {

  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      if (
        puzzle.grid[row][col] === "#"
      ) {
        continue;
      }


      const cell =
        cells[row][col];


      cell.letter = "";

      cell.letterElement.textContent =
        "";

      cell.element.classList.remove(
        "wrong",
        "correct"
      );
    }
  }


  localStorage.removeItem(
    progressKey()
  );


  document.getElementById(
    "status"
  ).textContent = "";


  updateSelection();
}


/* ============================================================
   REVEAL
============================================================ */

function revealPuzzle() {

  if (
    !confirm(
      "Reveal the entire puzzle?"
    )
  ) {
    return;
  }


  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      if (
        puzzle.grid[row][col] === "#"
      ) {
        continue;
      }


      const cell =
        cells[row][col];


      cell.letter =
        puzzle.grid[row][col];

      cell.letterElement.textContent =
        puzzle.grid[row][col];

      cell.element.classList.add(
        "correct"
      );
    }
  }


  saveProgress();


  document.getElementById(
    "status"
  ).textContent =
    "Puzzle revealed.";
}


/* ============================================================
   SAVE / LOAD
============================================================ */

function saveProgress() {

  const data = [];


  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      if (
        puzzle.grid[row][col] === "#"
      ) {
        continue;
      }


      const letter =
        cells[row][col].letter;


      if (letter) {

        data.push({

          row,

          col,

          letter

        });
      }
    }
  }


  localStorage.setItem(
    progressKey(),
    JSON.stringify(data)
  );
}


function loadProgress() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          progressKey()
        )
      );


    if (!Array.isArray(saved))
      return;


    saved.forEach(item => {

      if (
        cells[item.row] &&
        cells[item.row][item.col]
      ) {

        const cell =
          cells[item.row][item.col];

        cell.letter =
          item.letter;

        cell.letterElement.textContent =
          item.letter;
      }
    });

  } catch (error) {

    console.warn(
      "Unable to load saved progress.",
      error
    );
  }
}


/* ============================================================
   COUNTDOWN
============================================================ */

function updateCountdown() {

  const now =
    new Date();


  const tomorrow =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1,
      0,
      0,
      0
    );


  const difference =
    tomorrow - now;


  const hours =
    Math.floor(
      difference / 3600000
    );


  const minutes =
    Math.floor(
      (difference % 3600000) /
      60000
    );


  const seconds =
    Math.floor(
      (difference % 60000) /
      1000
    );


  document.getElementById(
    "countdown"
  ).textContent =
    `Next puzzle in ` +
    `${String(hours).padStart(2, "0")}:` +
    `${String(minutes).padStart(2, "0")}:` +
    `${String(seconds).padStart(2, "0")}`;
}


/* ============================================================
   DATE DISPLAY
============================================================ */

function displayDate() {

  document.getElementById(
    "today"
  ).textContent =
    new Date().toLocaleDateString(
      undefined,
      {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );
}


/* ============================================================
   INITIALIZE
============================================================ */

function initialize() {

  /*
     This will immediately throw an error if a future
     puzzle accidentally contains an invalid entry.
  */

  validatePuzzle();


  drawGrid();

  drawClues();

  loadProgress();

  displayDate();

  updateCountdown();

  setInterval(
    updateCountdown,
    1000
  );


  /*
     Start at the first valid cell.
  */

  outer:
  for (
    let row = 0;
    row < SIZE;
    row++
  ) {

    for (
      let col = 0;
      col < SIZE;
      col++
    ) {

      if (
        puzzle.grid[row][col] !== "#"
      ) {

        selectedRow = row;

        selectedCol = col;

        break outer;
      }
    }
  }


  updateSelection();
}


initialize();

</script>
