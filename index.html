<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Mental Health Crossword</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#f4f7f5;
  --card:#ffffff;
  --text:#17231d;
  --muted:#68746d;
  --line:#222a25;
  --accent:#39745c;
  --highlight:#dcefe7;
  --selected:#b9ddce;
  --correct:#def2df;
  --wrong:#ffdede;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

header{
  background:#fff;
  border-bottom:1px solid #d9e0db;
  text-align:center;
  padding:24px 12px 20px;
}

h1{
  margin:0;
  font-size:29px;
}

#date{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

main{
  max-width:900px;
  margin:28px auto 60px;
  padding:0 15px;
}

.layout{
  display:grid;
  grid-template-columns:400px 1fr;
  gap:35px;
  align-items:start;
}

#grid{
  width:400px;
  max-width:94vw;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:1px;
  background:var(--line);
  border:3px solid var(--line);
  margin:auto;
}

.cell{
  position:relative;
  background:#fff;
  cursor:pointer;
  user-select:none;
}

.cell.block{
  background:var(--line);
  cursor:default;
}

.cell.highlight{
  background:var(--highlight);
}

.cell.selected{
  background:var(--selected);
}

.cell.correct{
  background:var(--correct);
}

.cell.wrong{
  background:var(--wrong);
}

.number{
  position:absolute;
  top:3px;
  left:4px;
  font-size:10px;
  font-weight:800;
}

.letter{
  position:absolute;
  inset:12px 0 0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(27px,7vw,40px);
  font-weight:600;
}

.active{
  margin-top:13px;
  min-height:48px;
  padding:11px 13px;
  background:#fff;
  border:1px solid #d8dfda;
  border-radius:7px;
  display:flex;
  align-items:center;
  gap:9px;
}

.active b{
  color:var(--accent);
}

.controls{
  text-align:center;
  margin-top:12px;
}

button{
  border:1px solid #aab3ad;
  background:#fff;
  border-radius:7px;
  padding:9px 14px;
  margin:3px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#edf1ee;
}

#status{
  min-height:23px;
  margin-top:8px;
  font-weight:700;
}

#timer{
  color:var(--muted);
  font-size:13px;
}

.clues{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

h2{
  font-size:19px;
  border-bottom:2px solid var(--line);
  margin:0 0 8px;
  padding-bottom:6px;
}

.clue{
  display:flex;
  gap:8px;
  padding:8px 7px;
  border-radius:6px;
  cursor:pointer;
  line-height:1.35;
}

.clue:hover,
.clue.active{
  background:var(--highlight);
}

.clue-number{
  width:25px;
  flex:none;
  font-weight:800;
}

.help{
  margin-top:30px;
  background:#fff;
  border:1px solid #d8dfda;
  border-radius:8px;
  padding:16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

@media(max-width:700px){

  .layout{
    grid-template-columns:1fr;
  }

  #grid{
    margin:auto;
  }

  .clues{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:450px){

  h1{
    font-size:25px;
  }

  .clues{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Daily Mental Health Crossword</h1>
  <div id="date"></div>
</header>

<main>

<div class="layout">

<section>

  <div id="grid"></div>

  <div class="active">
    <b id="activeNumber"></b>
    <span id="activeClue"></span>
  </div>

  <div class="controls">
    <button id="checkBtn">Check</button>
    <button id="clearBtn">Clear</button>
    <button id="revealBtn">Reveal</button>

    <div id="status"></div>
    <div id="timer"></div>
  </div>

</section>

<section class="clues">

  <div>
    <h2>Across</h2>
    <div id="across"></div>
  </div>

  <div>
    <h2>Down</h2>
    <div id="down"></div>
  </div>

</section>

</div>

<div class="help">
  <strong>How to play:</strong>
  Click a square and type a letter.
  Click the selected square again to switch between Across and Down.
  Use the arrow keys to move.
  Backspace erases a letter.
  Your progress is saved automatically.
  A new crossword appears each day.
</div>

</main>

<script>

let puzzle = null;
let cells = [];

let selectedRow = 0;
let selectedCol = 0;
let direction = "across";

const today = new Date();

const dateKey =
  today.getFullYear() +
  "-" +
  String(today.getMonth() + 1).padStart(2, "0") +
  "-" +
  String(today.getDate()).padStart(2, "0");

document.getElementById("date").textContent =
  today.toLocaleDateString(undefined,{
    weekday:"long",
    month:"long",
    day:"numeric",
    year:"numeric"
  });


/* =========================================================
   DAILY INDEX
========================================================= */

function dayNumber(){

  const start =
    new Date(2024,0,1);

  const current =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.floor(
    (current - start) / 86400000
  );

}


/* =========================================================
   LOAD PUZZLES
========================================================= */

async function loadPuzzle(){

  try{

    const response =
      await fetch(
        "puzzles.json?cache=" +
        encodeURIComponent(dateKey),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Could not load puzzles.json"
      );

    }

    const data =
      await response.json();


    if(
      !data ||
      !Array.isArray(data.puzzles) ||
      !data.puzzles.length
    ){

      throw new Error(
        "puzzles.json contains no puzzles"
      );

    }


    const index =
      Math.abs(dayNumber()) %
      data.puzzles.length;


    puzzle =
      data.puzzles[index];


    validatePuzzle(puzzle);

    initialize();

  }catch(error){

    console.error(error);

    document.getElementById("grid").innerHTML = `
      <div style="
        grid-column:1/-1;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        background:#fff;
        padding:25px;
        font-size:14px;
      ">
        Unable to load today's crossword.<br>
        Make sure <strong>puzzles.json</strong>
        is in the same GitHub Pages folder as
        <strong>index.html</strong>.
      </div>
    `;

  }

}


/* =========================================================
   CLIENT-SIDE SAFETY VALIDATION
========================================================= */

function validatePuzzle(p){

  if(
    !p ||
    !Array.isArray(p.grid) ||
    p.grid.length !== 5
  ){

    throw new Error(
      "Invalid puzzle grid"
    );

  }


  for(const row of p.grid){

    if(
      typeof row !== "string" ||
      row.length !== 5
    ){

      throw new Error(
        "Invalid grid row"
      );

    }

  }


  if(
    !Array.isArray(p.across) ||
    p.across.length !== 5
  ){

    throw new Error(
      "Puzzle must have five Across clues"
    );

  }


  if(
    !Array.isArray(p.down) ||
    p.down.length !== 5
  ){

    throw new Error(
      "Puzzle must have five Down clues"
    );

  }


  for(
    const entry of [
      ...p.across,
      ...p.down
    ]
  ){

    if(
      typeof entry.answer !== "string" ||
      entry.answer.length < 3 ||
      entry.answer.length > 5
    ){

      throw new Error(
        "Invalid answer length"
      );

    }

  }

}


/* =========================================================
   STORAGE
========================================================= */

function storageKey(){

  return "mental-health-crossword-" +
    dateKey;

}


function save(){

  const data = [];

  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(
        cells[r] &&
        cells[r][c] &&
        cells[r][c].letter
      ){

        data.push([
          r,
          c,
          cells[r][c].letter
        ]);

      }

    }

  }

  localStorage.setItem(
    storageKey(),
    JSON.stringify(data)
  );

}


function load(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          storageKey()
        )
      );

    if(!Array.isArray(data))
      return;

    for(
      const item of data
    ){

      const [r,c,letter] = item;

      if(
        cells[r] &&
        cells[r][c] &&
        cells[r][c].letterElement
      ){

        cells[r][c].letter =
          letter;

        cells[r][c]
          .letterElement
          .textContent =
          letter;

      }

    }

  }catch(e){

    console.warn(
      "Could not load saved progress."
    );

  }

}


/* =========================================================
   FIND ENTRY
========================================================= */

function getEntry(){

  const list =
    direction === "across"
      ? puzzle.across
      : puzzle.down;


  return list.find(
    entry => {

      if(
        direction === "across"
      ){

        return (
          selectedRow === entry.row &&
          selectedCol >= entry.col &&
          selectedCol <
            entry.col + entry.length
        );

      }


      return (
        selectedCol === entry.col &&
        selectedRow >= entry.row &&
        selectedRow <
          entry.row + entry.length
      );

    }
  );

}


/* =========================================================
   NUMBER
========================================================= */

function cellNumber(r,c){

  const all =
    [
      ...puzzle.across,
      ...puzzle.down
    ];

  const entry =
    all.find(
      e =>
        e.row === r &&
        e.col === c
    );

  return entry
    ? entry.number
    : null;

}


/* =========================================================
   DRAW GRID
========================================================= */

function drawGrid(){

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  cells = [];


  for(let r=0;r<5;r++){

    cells[r] = [];

    for(let c=0;c<5;c++){

      const cell =
        document.createElement("div");

      cell.className = "cell";


      if(puzzle.grid[r][c] === "#"){

        cell.classList.add("block");

        grid.appendChild(cell);

        cells[r][c] = {
          element:cell,
          letter:""
        };

        continue;

      }


      const number =
        cellNumber(r,c);


      if(number !== null){

        const n =
          document.createElement("span");

        n.className = "number";
        n.textContent = number;

        cell.appendChild(n);

      }


      const letter =
        document.createElement("span");

      letter.className = "letter";

      cell.appendChild(letter);


      cells[r][c] = {
        element:cell,
        letterElement:letter,
        letter:""
      };


      cell.addEventListener(
        "click",
        () => {

          if(
            selectedRow === r &&
            selectedCol === c
          ){

            direction =
              direction === "across"
                ? "down"
                : "across";

          }else{

            selectedRow = r;
            selectedCol = c;

          }

          updateSelection();

        }
      );


      grid.appendChild(cell);

    }

  }

}


/* =========================================================
   CLUES
========================================================= */

function drawClues(){

  drawClueList(
    "across",
    document.getElementById("across")
  );

  drawClueList(
    "down",
    document.getElementById("down")
  );

}


function drawClueList(
  type,
  container
){

  container.innerHTML = "";

  const list =
    type === "across"
      ? puzzle.across
      : puzzle.down;


  list.forEach(
    (entry,index) => {

      const item =
        document.createElement("div");

      item.className = "clue";

      item.innerHTML = `
        <span class="clue-number">
          ${entry.number}.
        </span>
        <span>
          ${escapeHTML(entry.clue)}
        </span>
      `;


      item.addEventListener(
        "click",
        () => {

          direction = type;

          selectedRow =
            entry.row;

          selectedCol =
            entry.col;

          updateSelection();

        }
      );


      container.appendChild(item);

    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   SELECTION
========================================================= */

function updateSelection(){

  document
    .querySelectorAll(".cell")
    .forEach(
      el => {
        el.classList.remove(
          "highlight",
          "selected"
        );
      }
    );


  const entry =
    getEntry();


  if(!entry)
    return;


  for(
    let i=0;
    i<entry.length;
    i++
  ){

    const r =
      direction === "across"
        ? entry.row
        : entry.row + i;

    const c =
      direction === "across"
        ? entry.col + i
        : entry.col;


    cells[r][c]
      .element
      .classList.add("highlight");

  }


  cells[selectedRow][selectedCol]
    .element
    .classList.add("selected");


  document.getElementById(
    "activeNumber"
  ).textContent =
    `${entry.number}${direction === "across" ? "A" : "D"}`;


  document.getElementById(
    "activeClue"
  ).textContent =
    entry.clue;

}


/* =========================================================
   INPUT
========================================================= */

function enterLetter(letter){

  const cell =
    cells[selectedRow][selectedCol];


  if(
    !cell ||
    !cell.letterElement
  )
    return;


  cell.letter = letter;

  cell.letterElement.textContent =
    letter;

  cell.element.classList.remove(
    "correct",
    "wrong"
  );

  save();

  moveForward();

}


function erase(){

  const cell =
    cells[selectedRow][selectedCol];


  if(!cell)
    return;


  if(cell.letter){

    cell.letter = "";

    cell.letterElement.textContent = "";

    cell.element.classList.remove(
      "correct",
      "wrong"
    );

    save();

    return;

  }


  moveBackward();

}


/* =========================================================
   MOVEMENT
========================================================= */

function moveForward(){

  const entry =
    getEntry();


  if(!entry)
    return;


  if(direction === "across"){

    if(
      selectedCol <
      entry.col + entry.length - 1
    ){

      selectedCol++;

    }

  }else{

    if(
      selectedRow <
      entry.row + entry.length - 1
    ){

      selectedRow++;

    }

  }


  updateSelection();

}


function moveBackward(){

  const entry =
    getEntry();


  if(!entry)
    return;


  if(direction === "across"){

    if(
      selectedCol > entry.col
    ){

      selectedCol--;

    }

  }else{

    if(
      selectedRow > entry.row
    ){

      selectedRow--;

    }

  }


  updateSelection();

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      /^[a-zA-Z]$/.test(event.key)
    ){

      enterLetter(
        event.key.toUpperCase()
      );

      event.preventDefault();

      return;

    }


    if(
      event.key === "Backspace"
    ){

      erase();

      event.preventDefault();

      return;

    }


    if(
      event.key === "Tab"
    ){

      direction =
        direction === "across"
          ? "down"
          : "across";

      updateSelection();

      event.preventDefault();

      return;

    }


    if(
      event.key === "ArrowLeft"
    ){

      moveHorizontal(-1);
      event.preventDefault();

    }


    if(
      event.key === "ArrowRight"
    ){

      moveHorizontal(1);
      event.preventDefault();

    }


    if(
      event.key === "ArrowUp"
    ){

      moveVertical(-1);
      event.preventDefault();

    }


    if(
      event.key === "ArrowDown"
    ){

      moveVertical(1);
      event.preventDefault();

    }

  }
);


function moveHorizontal(amount){

  let c =
    selectedCol + amount;


  while(
    c >= 0 &&
    c < 5
  ){

    if(
      puzzle.grid[selectedRow][c] !== "#"
    ){

      selectedCol = c;
      direction = "across";
      updateSelection();
      return;

    }

    c += amount;

  }

}


function moveVertical(amount){

  let r =
    selectedRow + amount;


  while(
    r >= 0 &&
    r < 5
  ){

    if(
      puzzle.grid[r][selectedCol] !== "#"
    ){

      selectedRow = r;
      direction = "down";
      updateSelection();
      return;

    }

    r += amount;

  }

}


/* =========================================================
   CHECK
========================================================= */

function check(){

  let wrong = 0;
  let empty = 0;


  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(
        puzzle.grid[r][c] === "#"
      )
        continue;


      const cell =
        cells[r][c];


      cell.element.classList.remove(
        "correct",
        "wrong"
      );


      if(!cell.letter){

        empty++;
        continue;

      }


      if(
        cell.letter ===
        puzzle.grid[r][c]
      ){

        cell.element.classList.add(
          "correct"
        );

      }else{

        wrong++;

        cell.element.classList.add(
          "wrong"
        );

      }

    }

  }


  const status =
    document.getElementById("status");


  if(wrong){

    status.textContent =
      `${wrong} incorrect letter${wrong === 1 ? "" : "s"}.`;

    status.style.color =
      "#b3261e";

  }else if(empty){

    status.textContent =
      "So far, so good.";

    status.style.color =
      "#555";

  }else{

    status.textContent =
      "🎉 Puzzle complete!";

    status.style.color =
      "#287a4b";

    localStorage.setItem(
      "complete-" + dateKey,
      "1"
    );

  }

}


/* =========================================================
   CLEAR
========================================================= */

function clearPuzzle(){

  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(
        puzzle.grid[r][c] === "#"
      )
        continue;


      const cell =
        cells[r][c];


      cell.letter = "";

      cell.letterElement.textContent =
        "";

      cell.element.classList.remove(
        "correct",
        "wrong"
      );

    }

  }


  localStorage.removeItem(
    storageKey()
  );


  document.getElementById(
    "status"
  ).textContent = "";

}


/* =========================================================
   REVEAL
========================================================= */

function reveal(){

  if(
    !confirm(
      "Reveal the entire puzzle?"
    )
  ){

    return;

  }


  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(
        puzzle.grid[r][c] === "#"
      )
        continue;


      const cell =
        cells[r][c];


      cell.letter =
        puzzle.grid[r][c];

      cell.letterElement.textContent =
        puzzle.grid[r][c];

      cell.element.classList.add(
        "correct"
      );

    }

  }


  save();


  document.getElementById(
    "status"
  ).textContent =
    "Puzzle revealed.";

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

  const now =
    new Date();


  const tomorrow =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );


  let seconds =
    Math.max(
      0,
      Math.floor(
        (tomorrow - now) / 1000
      )
    );


  const hours =
    Math.floor(
      seconds / 3600
    );

  seconds %= 3600;


  const minutes =
    Math.floor(
      seconds / 60
    );

  seconds %= 60;


  document.getElementById(
    "timer"
  ).textContent =
    "Next puzzle in " +
    String(hours).padStart(2,"0") +
    ":" +
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");

}


/* =========================================================
   INITIALIZATION
========================================================= */

function initialize(){

  drawGrid();

  drawClues();

  load();

  updateTimer();

  setInterval(
    updateTimer,
    1000
  );


  /*
    Select first playable square.
  */

  outer:
  for(let r=0;r<5;r++){

    for(let c=0;c<5;c++){

      if(
        puzzle.grid[r][c] !== "#"
      ){

        selectedRow = r;
        selectedCol = c;

        break outer;

      }

    }

  }


  updateSelection();

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
  "checkBtn"
).addEventListener(
  "click",
  check
);

document.getElementById(
  "clearBtn"
).addEventListener(
  "click",
  clearPuzzle
);

document.getElementById(
  "revealBtn"
).addEventListener(
  "click",
  reveal
);


/* =========================================================
   START
========================================================= */

loadPuzzle();

</script>

</body>
</html>
